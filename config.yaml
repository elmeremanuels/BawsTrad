# Non-sensitive config — committed to git
# Secrets go in .env (gitignored)

scanner:
  price_min: 1.00
  price_max: 20.00
  price_preferred_min: 5.00
  price_preferred_max: 10.00
  gap_percent_min: 10.0
  relative_volume_min: 5.0
  float_max: 20_000_000
  float_preferred_max: 5_000_000
  gap_and_go_gap_min: 5.0
  gap_and_go_gap_preferred: 20.0
  gap_and_go_float_max: 50_000_000
  scan_interval_sec: 30
  scanner_stop_hour: 10        # ET — stop pre-market scanner at this hour (was 9:35)
  require_news_catalyst: true  # Set false to allow trades without Tier A/B news (fallback)

trading:
  mode: paper  # paper | live | backtest (overridden by TRADING_MODE env var)
  window_open: "09:30"
  window_close: "11:30"
  no_new_trades_after: "11:30"
  force_close_at: "15:55"
  timezone: "America/New_York"
  kill_switch_check_interval_sec: 5

risk:
  profit_loss_ratio_min: 2.0
  max_risk_per_trade_pct: 0.01
  daily_max_loss_pct: 0.03
  max_consecutive_losses: 3
  max_trades_per_day: 10
  post_loss_cooldown_sec: 60
  post_trade_cooldown_sec: 30
  max_position_pct: 0.25

tier: novice  # novice | beginner | advanced | pro

alerts:
  discord_enabled: true

dashboard:
  host: "127.0.0.1"
  port: 8080
  poll_interval_sec: 5

logging:
  level: INFO  # overridden by LOG_LEVEL env var
  file: logs/bot.log

state_machine:
  enabled: true                    # Set false to run in shadow-mode (log only, no enforcement)
  pre_market_start: "04:00"        # ET — enter PRE_MARKET_PREP
  active_trading_start: "09:30"    # ET — enter ACTIVE_TRADING
  position_mgmt_start: "11:30"     # ET — enter POSITION_MGMT (no new entries)
  eod_reflect_start:  "16:00"      # ET — enter EOD_REFLECT (approximate; uses actual close)
  overnight_intel_start: "20:00"   # ET — enter OVERNIGHT_INTEL
  stale_position_alert_hours: 4    # Warn if a position is open longer than this
  sweep_hours: [20, 22, 2]         # ET hours for overnight news sweeps
  pre_market_tasks:
    news_ingest:         "04:00"
    watchlist_rank:      "06:00"
    learnings_review:    "07:30"
    perplexity_briefing: "08:30"
    discord_briefing:    "08:45"
    pre_exec_check:      "09:00"
    t5_alert:            "09:25"
  eod_tasks:
    eod_learning:  "16:15"
    eow_learning:  "17:00"   # Fridays only
    eom_learning:  "17:30"   # Last trading day of month only
  weekend_tasks:             # Saturday ET times
    backtest_recent:  "09:00"
    weekly_learning:  "10:00"
    discord_summary:  "11:00"
