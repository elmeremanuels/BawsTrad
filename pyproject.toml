[project]
name = "trading-bot"
version = "0.1.0"
description = "Momentum day-trading bot — Warrior Trading methodology"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.102.0",
    "apscheduler>=3.11.2",
    "exchange-calendars>=4.5.6",
    "fastapi>=0.128.8",
    "groq>=1.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pydantic-settings>=2.11.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.39.0",
    "websockets>=15.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

